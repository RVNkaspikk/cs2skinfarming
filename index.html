```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RÆVEN Cases</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% -20%, #351010 0%, transparent 45%),
        #080808;
    color: white;
    min-height: 100vh;
}

header {
    height: 72px;
    border-bottom: 1px solid #242424;
    background: rgba(10,10,10,.95);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #ff3030;
}

.nav {
    display: flex;
    gap: 28px;
}

.nav a {
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
}

.nav a:hover {
    color: white;
}

.balance {
    display: flex;
    align-items: center;
    gap: 10px;
}

.money {
    background: #151515;
    border: 1px solid #292929;
    padding: 10px 15px;
    border-radius: 9px;
    color: #ff4444;
    font-weight: bold;
}

.deposit {
    border: 0;
    background: #e52b2b;
    color: white;
    padding: 10px 16px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.deposit:hover {
    background: #ff3d3d;
}

.hero {
    text-align: center;
    padding: 75px 20px 45px;
}

.hero h1 {
    font-size: 48px;
    font-weight: 900;
}

.hero h1 span {
    color: #ff3030;
}

.hero p {
    color: #888;
    margin-top: 12px;
}

.cases {
    width: 86%;
    max-width: 1250px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    padding-bottom: 60px;
}

.case {
    background: linear-gradient(145deg,#141414,#0d0d0d);
    border: 1px solid #252525;
    border-radius: 15px;
    padding: 22px;
    text-align: center;
    transition: .2s;
}

.case:hover {
    transform: translateY(-5px);
    border-color: #ff3030;
    box-shadow: 0 15px 35px rgba(255,0,0,.12);
}

.case-img {
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
    filter: drop-shadow(0 10px 20px rgba(255,0,0,.2));
}

.case h2 {
    font-size: 19px;
    margin-bottom: 8px;
}

.case-price {
    color: #ff3b3b;
    font-weight: bold;
    margin-bottom: 15px;
}

.open-btn {
    width: 100%;
    padding: 12px;
    background: #e52b2b;
    border: 0;
    color: white;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.open-btn:hover {
    background: #ff4141;
}

.inventory-section {
    width: 86%;
    max-width: 1250px;
    margin: auto;
    padding-bottom: 80px;
}

.inventory-section h2 {
    margin-bottom: 20px;
}

.inventory {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
    gap: 15px;
}

.item {
    background: #111;
    border: 1px solid #252525;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
}

.item-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.item-name {
    font-size: 14px;
    font-weight: bold;
}

.rarity {
    margin-top: 7px;
    font-size: 12px;
    font-weight: bold;
}

.blue { color:#4ca3ff; }
.purple { color:#a970ff; }
.pink { color:#ff4fa3; }
.red { color:#ff4141; }
.gold { color:#ffd43b; }

.empty {
    color:#666;
    padding:25px;
    border:1px dashed #292929;
    border-radius:10px;
    grid-column:1/-1;
    text-align:center;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 90%;
    max-width: 700px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 30px;
    text-align: center;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.roulette {
    height: 150px;
    overflow: hidden;
    position: relative;
    border: 1px solid #292929;
    border-radius: 12px;
    background: #090909;
}

.roulette-track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 0;
    top: 25px;
    transition: transform 4s cubic-bezier(.12,.75,.12,1);
}

.roulette-item {
    min-width: 120px;
    height: 100px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.roulette-item span {
    font-size: 42px;
}

.pointer {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: #ff3030;
    z-index: 2;
}

.result {
    display: none;
    margin-top: 22px;
}

.result-icon {
    font-size: 80px;
}

.result h3 {
    font-size: 23px;
    margin-top: 8px;
}

.close {
    margin-top: 20px;
    background: #222;
    border: 1px solid #333;
    color: white;
    padding: 10px 25px;
    border-radius: 8px;
    cursor: pointer;
}

.deposit-box {
    max-width: 400px;
}

.deposit-options {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-top: 20px;
}

.deposit-option {
    background: #181818;
    border: 1px solid #292929;
    padding: 15px;
    border-radius: 9px;
    color: white;
    cursor: pointer;
}

.deposit-option:hover {
    border-color: #ff3030;
}

footer {
    text-align: center;
    border-top: 1px solid #202020;
    padding: 25px;
    color: #555;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">RÆ<span>VEN</span></div>

    <nav class="nav">
        <a href="#cases">Cases</a>
        <a href="#inventory">Inventory</a>
    </nav>

    <div class="balance">
        <div class="money">$<span id="balance">100.00</span></div>
        <button class="deposit" onclick="openDeposit()">+ Deposit</button>
    </div>
</header>

<section class="hero">
    <h1>OPEN <span>CASES</span></h1>
    <p>Open demo cases and collect virtual skins.</p>
</section>

<section class="cases" id="cases"></section>

<section class="inventory-section" id="inventory">
    <h2>Your Inventory</h2>
    <div class="inventory" id="inventoryList">
        <div class="empty">Your inventory is empty.</div>
    </div>
</section>

<footer>
    RÆVEN CASES — DEMO / VIRTUAL CURRENCY ONLY
</footer>

<!-- CASE MODAL -->

<div class="modal" id="caseModal">
    <div class="modal-box">
        <h2 id="modalTitle">Opening case...</h2>

        <div class="roulette">
            <div class="pointer"></div>
            <div class="roulette-track" id="rouletteTrack"></div>
        </div>

        <div class="result" id="result">
            <div class="result-icon" id="resultIcon"></div>
            <h3 id="resultName"></h3>
            <div class="rarity" id="resultRarity"></div>
        </div>

        <button class="close" onclick="closeCase()">Close</button>
    </div>
</div>

<!-- DEPOSIT MODAL -->

<div class="modal" id="depositModal">
    <div class="modal-box deposit-box">
        <h2>Demo Deposit</h2>
        <p style="color:#777">Adds virtual balance only.</p>

        <div class="deposit-options">
            <button class="deposit-option" onclick="addBalance(10)">+$10</button>
            <button class="deposit-option" onclick="addBalance(25)">+$25</button>
            <button class="deposit-option" onclick="addBalance(50)">+$50</button>
            <button class="deposit-option" onclick="addBalance(100)">+$100</button>
        </div>

        <button class="close" onclick="closeDeposit()">Close</button>
    </div>
</div>

<script>

let balance = 100;
let inventory = [];

const cases = [
    {
        name: "RÆVEN STARTER",
        price: 2.50,
        icon: "📦",
        items: [
            ["Glock-18 | Night", "🔫", "blue"],
            ["USP-S | Black", "🔫", "blue"],
            ["AK-47 | Slate", "🔫", "purple"],
            ["M4A1-S | Dark", "🔫", "purple"],
            ["AWP | Redline", "🔫", "pink"],
            ["AK-47 | Fire", "🔫", "red"],
            ["★ Karambit", "🔪", "gold"]
        ]
    },
    {
        name: "RED STORM",
        price: 7.50,
        icon: "🔥",
        items: [
            ["P250 | Red", "🔫", "blue"],
            ["MP9 | Blaze", "🔫", "blue"],
            ["M4A4 | Evil", "🔫", "purple"],
            ["AK-47 | Blood", "🔫", "pink"],
            ["AWP | Hyper", "🔫", "pink"],
            ["M4A1-S | Hot Rod", "🔫", "red"],
            ["★ Butterfly Knife", "🔪", "gold"]
        ]
    },
    {
        name: "BLACKOUT",
        price: 15.00,
        icon: "🖤",
        items: [
            ["USP-S | Dark", "🔫", "blue"],
            ["FAMAS | Night", "🔫", "blue"],
            ["AK-47 | Black", "🔫", "purple"],
            ["M4A1-S | Print", "🔫", "pink"],
            ["AWP | Black", "🔫", "pink"],
            ["AK-47 | Vulcan", "🔫", "red"],
            ["★ Karambit | Black", "🔪", "gold"]
        ]
    },
    {
        name: "RÆVEN ELITE",
        price: 30.00,
        icon: "👑",
        items: [
            ["Five-SeveN | Blue", "🔫", "blue"],
            ["Desert Eagle | Night", "🔫", "purple"],
            ["M4A4 | Emperor", "🔫", "pink"],
            ["AK-47 | Asiimov", "🔫", "pink"],
            ["AWP | Dragon", "🔫", "red"],
            ["M4A1-S | Printstream", "🔫", "red"],
            ["★ Butterfly Knife", "🔪", "gold"]
        ]
    }
];

function renderCases() {
    const container = document.getElementById("cases");

    cases.forEach((c, index) => {
        container.innerHTML += `
            <div class="case">
                <div class="case-img">${c.icon}</div>
                <h2>${c.name}</h2>
                <div class="case-price">$${c.price.toFixed(2)}</div>
                <button class="open-btn" onclick="openCase(${index})">
                    OPEN CASE
                </button>
            </div>
        `;
    });
}

function updateBalance() {
    document.getElementById("balance").textContent = balance.toFixed(2);
}

function openDeposit() {
    document.getElementById("depositModal").classList.add("active");
}

function closeDeposit() {
    document.getElementById("depositModal").classList.remove("active");
}

function addBalance(amount) {
    balance += amount;
    updateBalance();
    closeDeposit();
}

function randomItem(items) {
    const roll = Math.random() * 100;

    let rarity;

    if (roll < 3) rarity = "gold";
    else if (roll < 10) rarity = "red";
    else if (roll < 25) rarity = "pink";
    else if (roll < 50) rarity = "purple";
    else rarity = "blue";

    const possible = items.filter(item => item[2] === rarity);

    return possible.length
        ? possible[Math.floor(Math.random() * possible.length)]
        : items[Math.floor(Math.random() * items.length)];
}

function openCase(index) {

    const c = cases[index];

    if (balance < c.price) {
        alert("Not enough demo balance!");
        return;
    }

    balance -= c.price;
    updateBalance();

    const modal = document.getElementById("caseModal");
    const track = document.getElementById("rouletteTrack");
    const result = document.getElementById("result");

    modal.classList.add("active");
    result.style.display = "none";

    document.getElementById("modalTitle").textContent =
        "Opening " + c.name + "...";

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";
    track.innerHTML = "";

    const winningItem = randomItem(c.items);

    let items = [];

    for (let i = 0; i < 45; i++) {
        items.push(c.items[Math.floor(Math.random() * c.items.length)]);
    }

    items[38] = winningItem;

    items.forEach(item => {
        track.innerHTML += `
            <div class="roulette-item">
                <span>${item[1]}</span>
                <small class="${item[2]}">${item[0]}</small>
            </div>
        `;
    });

    setTimeout(() => {

        const itemWidth = 132;
        const target = (itemWidth * 38) - 280;

        track.style.transition =
            "transform 4s cubic-bezier(.12,.75,.12,1)";

        track.style.transform =
            `translateX(-${target}px)`;

    }, 100);

    setTimeout(() => {

        document.getElementById("resultIcon").textContent =
            winningItem[1];

        document.getElementById("resultName").textContent =
            winningItem[0];

        const rarity = document.getElementById("resultRarity");

        rarity.textContent =
            winningItem[2].toUpperCase();

        rarity.className =
            "rarity " + winningItem[2];

        result.style.display = "block";

        inventory.push(winningItem);
        renderInventory();

    }, 4300);
}

function closeCase() {
    document.getElementById("caseModal").classList.remove("active");
}

function renderInventory() {

    const list = document.getElementById("inventoryList");

    if (inventory.length === 0) {
        list.innerHTML =
            `<div class="empty">Your inventory is empty.</div>`;
        return;
    }

    list.innerHTML = "";

    inventory.forEach(item => {
        list.innerHTML += `
            <div class="item">
                <div class="item-icon">${item[1]}</div>
                <div class="item-name">${item[0]}</div>
                <div class="rarity ${item[2]}">
                    ${item[2].toUpperCase()}
                </div>
            </div>
        `;
    });
}

renderCases();
updateBalance();

</script>

</body>
</html>
